<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script src="db.js"></script>
    <script>
      function testClarifiedGlobalApi() {
        try {
          const costsDb = db.openCostsDB('costsdb', 1);
          const firstAddedCost = costsDb.addCost({ sum: 200, currency: 'USD', category: 'FOOD', description: 'pizza' });
          const secondAddedCost = costsDb.addCost({ sum: 400, currency: 'ILS', category: 'CAR', description: 'fuel' });

          // Confirm that the global factory returned the required instance-level API.
          if (costsDb) {
            console.log('creating db succeeded');
          }

          // Both add operations must return their public cost objects before reporting.
          if (firstAddedCost) {
            console.log('adding 1st cost item succeeded');
          }
          if (secondAddedCost) {
            console.log('adding 2nd cost item succeeded');
          }

          // getReport remains synchronous and reads rates retained by the Vanilla library.
          const report = costsDb.getReport('USD');
          console.log(report.total.sum);
        } catch (error) {
          console.log(error.message);
        }
      }
      // A brief delay lets the standalone script's startup Fetch normally complete.
      setTimeout(testClarifiedGlobalApi, 100);
    </script>
</body>
</html>
